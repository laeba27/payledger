# Local infrastructure.
#   docker compose up -d                  → Postgres + Redis (run the app with ./mvnw spring-boot:run)
#   docker compose --profile app up -d    → also builds and runs the app in a container
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payledger
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
    ports: ["5433:5432"]   # 5433 on the Mac, because a locally installed Postgres already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payledger
      SPRING_DATA_REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports: ["8080:8080"]

volumes:
  pgdata:
